<!--suppress ALL -->
{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
<div class="form-container">
    <h2>📝 Registro de Usuario</h2>
    <form method="POST" action="{{ url_for('registro') }}">
        <div class="form-group"><label for="numeroControl">Número de control / ID</label>
            <input type="text" id="numeroControl" name="numeroControl" required></div>

        <div class="form-group"><label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required></div>

        <div class="form-group"><label for="sexo">Sexo</label>
            <select id="sexo" name="sexo" required>{% for s in sexos %}<option value="{{ s }}">{{ s }}</option>{% endfor %}</select></div>

        <!-- NUEVO: Tipo de Usuario -->
        <div class="form-group">
            <label for="rol">Tipo de Usuario</label>
            <select id="rol" name="rol" required>
                <option value="estudiante">Estudiante</option>
                <option value="validador">Validador</option>
                <option value="laboratorista">Laboratorista</option>
            </select>
        </div>

        <!-- Envolvemos estos dos en divs con ID -->
        <div class="form-group" id="grupo-carrera">
            <label for="carrera">Carrera</label>
            <select id="carrera" name="carrera">
                <option value="">Elige tu carrera…</option>
                {% for c in carreras %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
            </select>
        </div>

        <div class="form-group" id="grupo-semestre">
            <label for="semestre">Semestre que cursas</label>
            <select id="semestre" name="semestre">
                <option value="">Elige…</option>
                {% for n in semestres %}<option value="{{ n }}">{{ n }}.º semestre</option>{% endfor %}
            </select>
        </div>

        <div class="form-group"><label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required></div>

        <button type="submit" class="btn block">Crear cuenta</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión aquí</a></p>
</div>

<!-- Script para ocultar/mostrar campos -->
<script>
    document.getElementById("rol").addEventListener("change", function() {
        const carrera = document.getElementById("grupo-carrera");
        const semestre = document.getElementById("grupo-semestre");

        if (this.value === "estudiante") {
            carrera.style.display = "block";
            semestre.style.display = "block";
            // Hacerlos obligatorios
            document.getElementById("carrera").required = true;
            document.getElementById("semestre").required = true;
        } else {
            carrera.style.display = "none";
            semestre.style.display = "none";
            // Quitar la obligatoriedad
            document.getElementById("carrera").required = false;
            document.getElementById("semestre").required = false;
        }
    });
</script>
{% endblock %}
